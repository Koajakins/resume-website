<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="2in" viewBox="0 0 1050 600">
  <defs>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        src: url('data:font/woff2;base64,FONT_B64_PLACEHOLDER') format('woff2');
      }
    </style>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#38bdf8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1050" height="600" fill="#0f172a"/>

  <!-- Full dot grid -->
  <rect width="1050" height="600" fill="url(#dots)" opacity="0.07"/>

  <!-- Large TH mark centred -->
  <rect x="441" y="196" width="168" height="168" rx="28" fill="#1e293b"/>
  <text x="525" y="305" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="70" fill="#38bdf8" text-anchor="middle">TH</text>

  <!-- Domain label -->
  <text x="525" y="460" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" fill="#2d3f55" text-anchor="middle">haggath.re</text>
</svg>
