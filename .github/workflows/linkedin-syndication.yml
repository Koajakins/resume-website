name: LinkedIn Syndication

on:
  push:
    branches: [main]
    paths:
      - 'blog/src/posts/**'

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Get new post file
        id: new-posts
        run: |
          NEW=$(git diff --name-only HEAD~1 HEAD -- 'blog/src/posts/*.md' | head -1)
          echo "file=$NEW" >> $GITHUB_OUTPUT

      - name: Post to LinkedIn
        if: steps.new-posts.outputs.file != ''
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          POST_FILE: ${{ steps.new-posts.outputs.file }}
        run: python3 scripts/linkedin_post.py
